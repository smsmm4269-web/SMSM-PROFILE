<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Message Sender</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#1e1e1e;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:90%;
    max-width:400px;
    background:#2b2b2b;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}
</style>
</head>
<body>

<div class="container">
    <h1>Send WhatsApp Message</h1>

    <input
        type="text"
        id="message"
        placeholder="Write your message here..."
    >

    <button onclick="sendWhatsApp()">
        Send to WhatsApp
    </button>
</div>

<script>
function sendWhatsApp() {

    let msg = document.getElementById("message").value.trim();

    if(msg === ""){
        alert("Please write a message");
        return;
    }

    let phone = "201040848360";

    let url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;

    window.location.href = url;
}
</script>

</body>
</html>
